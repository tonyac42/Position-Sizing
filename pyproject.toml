[project]
name = "sizer-monorepo"
version = "0.2.0"
description = "Universal position sizing engine and product"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["packages/sizer_engine", "apps/api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
