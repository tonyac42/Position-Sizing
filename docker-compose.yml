services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SIZER_DEV_MODE: "1"
      SIZER_ALLOWED_ORIGINS: "http://localhost:5173"
    ports:
      - "8000:8000"
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      PORT: "5173"
    ports:
      - "5173:5173"
    depends_on:
      - api
