name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff pytest fastapi uvicorn
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/sizer_engine:${{ github.workspace }}/apps/api
      - run: tests/e2e_ui_roundtrip.sh
